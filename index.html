<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnackLab 🍓 | Crea tu snack, a tu manera</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ============================================= -->
    <!-- HEADER: zona superior con la navegación       -->
    <!-- ============================================= -->
    <header class="header">
        <nav class="navbar">
            <!-- Logo: enlaza al inicio de la página -->
            <a href="#inicio" class="navbar__logo">SNACKLAB 🍓</a>

            <!-- Menú de enlaces internos (anclas a cada sección) -->
            <ul class="navbar__menu">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#como-funciona">Personaliza</a></li>
                <li><a href="#snacks">Snacks</a></li>
                <li><a href="#ocasiones">Ocasiones</a></li>
                <li><a href="#nosotros">Nosotros</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>

            <!-- Botón principal (CTA): visualmente es un botón, por dentro un enlace -->
            <a href="#contacto" class="navbar__cta">Crear mi SnackBox</a>
        </nav>
    </header>

    <!-- ============================================= -->
    <!-- MAIN: contenido principal de la página         -->
    <!-- ============================================= -->
    <main>

        <!-- HERO: primera impresión (Fase 5) -->
        <section id="inicio">
            <!-- Título, subtítulo, botones e imagen -->
        </section>

        <!-- CÓMO FUNCIONA: 4 pasos (Fase 6) -->
        <section id="como-funciona">
            <!-- 4 cards: elige tamaño, escoge snacks, personaliza, disfruta -->
        </section>

        <!-- NUESTROS SNACKS: catálogo (Fase 7) -->
        <section id="snacks">
            <!-- 4 categorías: dulces, salados, naturales, energéticos -->
        </section>

        <!-- OCASIONES: SnackBox temáticas (Fase 8) -->
        <section id="ocasiones">
            <!-- 4 cards: cumpleaños, regalo, movie night, study box -->
        </section>

        <!-- ¿POR QUÉ SNACKLAB?: beneficios (Fase 9) -->
        <section id="beneficios">
            <!-- 4 beneficios: personalizable, variedad, para cada ocasión, a tu medida -->
        </section>

        <!-- SOBRE NOSOTROS: historia de la marca (Fase 10) -->
        <section id="nosotros">
            <!-- Texto de la marca + CTA -->
        </section>

        <!-- CONTACTO: formulario visual (Fase 11) -->
        <section id="contacto">
            <!-- Formulario: nombre, email, ocasión, mensaje -->
        </section>

    </main>

    <!-- ============================================= -->
    <!-- FOOTER: pie de página (Fase 12)                -->
    <!-- ============================================= -->
    <footer>
        <!-- Logo, tagline, enlaces, redes, copyright -->
    </footer>

</body>
</html>
